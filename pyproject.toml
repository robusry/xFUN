[project]
name = "xfun"
version = "0.1.0"
description = "Predicting which soccer matches will be entertaining to watch"
requires-python = ">=3.12"
dependencies = []

# Workspace members are listed explicitly rather than globbed, so that adding a
# package is a deliberate act and a stray directory never becomes a package by
# accident. Adding a model means one line here and one directory.
[tool.uv.workspace]
members = [
    "packages/scoring-contract",
    "packages/scoring-runtime",
    "packages/store",
    "packages/composition",
    "packages/ingestion",
    "packages/api",
    "packages/models/*",
]

# Each package depends on its siblings through the workspace, never through PyPI.
[tool.uv.sources]
xfun-scoring-contract = { workspace = true }
xfun-scoring-runtime = { workspace = true }
xfun-store = { workspace = true }
xfun-composition = { workspace = true }
xfun-ingestion = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["packages"]
pythonpath = ["."]
# importlib mode keeps same-named test files in different packages from colliding,
# which they otherwise do in a monorepo (two test_determinism.py, one per model).
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
