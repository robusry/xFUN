[project]
name = "xfun-collector-fixture-signals"
version = "0.1.0"
description = "PLACEHOLDER collectors reading golden fixtures from disk. No network, no provider, no credentials."
requires-python = ">=3.12"

# Unlike a model, a collector MAY declare an HTTP client, a credentials library, or
# any third-party source SDK -- reaching outside the process is the purpose of this
# tier. These particular collectors need none of that, because they read files.
#
# `xfun-scoring-runtime` is here only for `fixtures_dir()`, the same reason
# `xfun-ingestion` depends on it. A real collector would not need it.
dependencies = [
    "xfun-scoring-contract",
    "xfun-scoring-runtime",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfun_collector_fixture_signals"]
