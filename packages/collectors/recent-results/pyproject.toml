[project]
name = "xfun-collector-recent-results"
version = "0.1.0"
description = "Goals each team scored in its last five completed matches, read from dated schedule pages."
requires-python = ">=3.12"

# A collector MAY declare an HTTP client and any source SDK -- reaching outside the
# process is the purpose of this tier, and the dependency check exempts it.
#
# `xfun-ingestion` is here for two things the schedule source already owns and that
# must not be duplicated: how to fetch one dated page from this source (including
# what to do about a 403), and how a team name becomes a canonical id. The second
# matters most -- this collector's output is joined onto the slate by canonical team
# id, so a second slug implementation that disagreed by one character would drop
# values onto no team at all, silently. See design D8 of `add-recent-goals-model`.
dependencies = [
    "xfun-scoring-contract",
    "xfun-ingestion",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfun_collector_recent_results"]
