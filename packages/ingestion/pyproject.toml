[project]
name = "xfun-ingestion"
version = "0.1.0"
description = "Slate assembly, canonical entity writing, and the schedule source."
requires-python = ">=3.12"
dependencies = [
    "xfun-scoring-contract",
    "xfun-scoring-runtime",
    "xfun-store",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfun_ingestion"]
