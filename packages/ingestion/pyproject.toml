[project]
name = "xfun-ingestion"
version = "0.1.0"
description = "Data source adapters. Fixture-backed in the skeleton; no network."
requires-python = ">=3.12"
dependencies = [
    "xfun-scoring-contract",
    "xfun-scoring-runtime",
    "xfun-store",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfun_ingestion"]
