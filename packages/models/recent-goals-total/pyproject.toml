[project]
name = "xfun-model-recent-goals-total"
version = "0.1.0"
description = "Both sides' goals from their last five completed matches, added together."
requires-python = ">=3.12"

# A model depends on the contract and nothing else. If this list ever grows a
# database driver or an HTTP client, the purity check in CI will fail it.
dependencies = [
    "xfun-scoring-contract",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfun_model_recent_goals_total"]
