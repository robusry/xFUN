[project]
name = "xfun-model-over-under-lean"
version = "0.1.0"
description = "Leans on the market's expected goal total. PLACEHOLDER."
requires-python = ">=3.12"

# A model depends on the contract and nothing else. If this list ever grows a
# database driver or an HTTP client, the purity check in CI will fail it.
dependencies = [
    "xfun-scoring-contract",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfun_model_over_under_lean"]
