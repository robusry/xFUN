[project]
name = "xfun-scoring-contract"
version = "0.1.0"
description = "The interface every scoring model implements. Types only; no I/O."
requires-python = ">=3.12"

# Deliberately empty. This package is the one thing every model depends on, so
# anything added here is imposed on every model. Keep it that way.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfun_contract"]
