[project]
name = "xfun-scoring-runtime"
version = "0.1.0"
description = "Model registry, feature assembly, the model runner, and calibration."
requires-python = ">=3.12"
dependencies = [
    "xfun-scoring-contract",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfun_runtime"]
