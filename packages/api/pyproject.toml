[project]
name = "xfun-api"
version = "0.1.0"
description = "Read-only public API. Reads precomputed scores; never runs a model."
requires-python = ">=3.12"

# NOTE the absence of any xfun-model-* dependency. That is enforced in CI, not
# left to discipline: the API must never be able to execute a model.
dependencies = [
    "xfun-scoring-contract",
    "xfun-scoring-runtime",
    "xfun-store",
    "xfun-composition",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfun_api"]
