[project]
name = "xfun-composition"
version = "0.1.0"
description = "Versioned composition recipes and repointable score aliases."
requires-python = ">=3.12"
dependencies = [
    "xfun-scoring-contract",
    "xfun-scoring-runtime",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfun_composition"]
