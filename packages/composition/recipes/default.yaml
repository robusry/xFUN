# The default blend.
#
# THIS FILE IS CONFIGURATION, NOT CODE. Changing the weights is a config diff any
# team member can read, review, and revert -- deliberately, because how models are
# combined is expected to change repeatedly and the cost of one change must be
# near zero. Recompose runs over stored raw scores in seconds; no model re-runs.
#
# Zone C: changing these values does NOT require an OpenSpec change. The
# composition *mechanism* is Zone A; these *values* are not. See docs/zones.md.
#
# One model, at weight 1.0, and that is a claim about the other two rather than
# about this one. `over-under-lean` and `odds-spread` are placeholders that predict
# nothing and score nothing on a live run, so blending them in would give the
# composed number a provenance that is mostly invented.
#
# `recent-goals-total` is not validated either -- nothing here is, until there is a
# ground-truth label for "entertaining" and `add-evaluation-harness` to test against
# it. What is different is that its inputs are real goals from matches that were
# really played, so it can be wrong in a way somebody can check by watching.
#
# Restoring a blend is one line. That is the point of this file.

id: default
version: 1

models:
  recent-goals-total: 1.0

# Required field, deliberately not defaulted: coverage gaps are routine, and
# leaving this implicit means each recipe author resolves it differently.
#   require-all  - no composed score unless every model scored     (not implemented)
#   renormalize  - compose from what is present, redistribute weight
#   fallback     - substitute a named alternative model            (not implemented)
on_missing: renormalize

# Below this many contributing models, produce no composed score and say why.
min_models: 1
